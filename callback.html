<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>KKLA - Knice Kustoms Linking Assistant</title>
</head>
<body>
    <h2>Authorizing...</h2>
    <script>
        const params = new URLSearchParams(window.location.search);
        const code = params.get("code");

        if (!code) {
            document.body.innerHTML = "<p>No code provided.</p>";
        } else {
            fetch("https://dueruem.minecraftnoob.com:27018/oauth", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({code: code})
            }).then(res => {
                if (res.ok) {
                    document.body.innerHTML = "<p>Authorization complete! You can close this page.</p>";
                } else {
                    document.body.innerHTML = "<p>Error sending authorization code to bot.</p>";
                }
            }).catch(err => {
                document.body.innerHTML = "<p>Network error.</p>";
                console.error(err);
            });
        }
    </script>
</body>
</html>
