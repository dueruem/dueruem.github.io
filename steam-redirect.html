<!DOCTYPE html>
<html>
<head>
    <title>Connecting to Steam Server...</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <p>Attempting to launch Steam and connect to the server. This window will close automatically.</p>
    <p id="fallback-message" style="display: none;">If it doesn't open, click the link below:</p>
    <p><a id="steam-link" href="#" style="display: none;">Click to Connect Manually</a></p>

    <script>
        const queryString = window.location.search;
        const urlParams = new URLSearchParams(queryString);
        const steamUri = urlParams.get('uri');

        if (steamUri) {
            // 1. Initiate the Steam redirect first
            window.location.href = steamUri;

            // 2. Set a brief timeout (e.g., 500ms or 1 second)
            // This ensures the browser has time to start processing the steam:// protocol
            setTimeout(function() {
                // 3. Attempt to close the window/tab
                window.close();
            }, 500); // 500 milliseconds (half a second) delay

            // 4. Update the fallback link for manual connection
            document.getElementById('steam-link').href = steamUri;
            document.getElementById('steam-link').style.display = 'inline';
            document.getElementById('fallback-message').style.display = 'block';

        } else {
            // Error handling if URI is missing
            document.body.innerHTML = '<h1>Error: Steam URI not provided.</h1><p>Please ensure the link is correctly formatted.</p>';
        }
    </script>
</body>
</html>
